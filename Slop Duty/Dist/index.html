<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Slop Duty</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!--
      Fills whatever frame it is given instead of being a fixed 1920 by 1080 box.

      Unity's template centres a canvas of an exact pixel size, which on itch means a page
      wider than most laptops and a set of scrollbars. Letting it fill the frame means the
      itch viewport alone decides how big the game is, and CameraFit already adapts the
      world to whatever shape that turns out to be.

      Unity keeps its render target matched to the canvas's CSS size, so this stays sharp at
      any size rather than being a stretched 1080p image.
    -->
    <style>
      html, body { width: 100%; height: 100%; overflow: hidden; background: #231F20; }

      #unity-container.unity-desktop {
        left: 0; top: 0; width: 100%; height: 100%; transform: none;
      }

      #unity-canvas { width: 100%; height: 100%; display: block; }

      /* itch puts its own fullscreen button on the frame, and Unity's footer would only
         take a strip off the bottom of the game to duplicate it. */
      #unity-footer { display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <!-- No width or height attributes on purpose. With them set, Unity locks its render
           target to those numbers and never matches it to the box the canvas is actually
           drawn in, so the picture gets squashed to fit. See fitCanvas below. -->
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Slop Duty</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Keeps the render target the same shape and size as the box the canvas occupies.
      //
      // Unity is supposed to do this itself, and does not: with a fixed size on the canvas
      // element it renders at that size forever and the browser squashes the result into
      // whatever space the page actually gives it. Measured on a 683 by 325 frame it was
      // still rendering 1920 by 1080, so the game came out stretched.
      //
      // Multiplied by devicePixelRatio so it stays sharp on a retina screen rather than
      // being drawn at half resolution and scaled up.
      function fitCanvas() {
        var rect = canvas.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;

        var w = Math.max(1, Math.round(rect.width * dpr));
        var h = Math.max(1, Math.round(rect.height * dpr));

        // Guarded, because assigning to canvas.width clears the drawing buffer even when
        // the value has not changed, which would flicker the game every resize event.
        if (canvas.width === w && canvas.height === h) return;

        canvas.width = w;
        canvas.height = h;
      }

      window.addEventListener("resize", fitCanvas);

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Dist.loader.js";
      var config = {
        // Plain files, not the .br ones the build produced.
        //
        // This build was made with Brotli compression and WITHOUT Decompression Fallback,
        // which means the loader carries no decompressor and the web server has to announce
        // the files with "Content-Encoding: br". Serving them locally with that header, the
        // game loads perfectly; without it, the loader cannot read a byte and you get a
        // blank canvas. itch does not send it.
        //
        // Decompressing them here sidesteps the whole question: plain files need nothing
        // from the server at all. The cost is download size, roughly 39MB against 11MB.
        //
        // The permanent fix is Player Settings, Publishing Settings, Decompression Fallback,
        // then rebuild. That keeps the small files AND works anywhere, because the loader
        // does the decompressing itself.
        dataUrl: buildUrl + "/Dist.data",
        frameworkUrl: buildUrl + "/Dist.framework.js",
        codeUrl: buildUrl + "/Dist.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Slop Duty",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      // Sized before Unity starts, so it never sees a zero-sized canvas, and again once the
      // instance exists in case the frame settled while it was loading.
      fitCanvas();

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fitCanvas();
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
